name: decode-b64-assets
on:
  push:
    branches: [main]
    paths: ['**.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 files
        run: |
          set -e
          shopt -s nullglob
          changed=0
          for f in *.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            git rm -q "$f"
            git add "$out"
            changed=1
          done
          if [ "$changed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Decode base64 image assets"
            git push
          fi
